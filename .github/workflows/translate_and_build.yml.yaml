name: Sync, Translate and Build AI Context

on:
  schedule:
    - cron: '0 0 * * 0' # Запуск каждое воскресенье в полночь
  workflow_dispatch: # Кнопка ручного запуска в интерфейсе GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешение на пуш коммитов

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Sync Upstream (Download Chinese Docs)
        run: python scripts/sync_upstream.py

      - name: Run Auto Translator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/auto_translate.py

      - name: Build AI Context Files
        run: python scripts/build_ai_context.py

      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update: Sync, Translation, and Context Build" || echo "No changes to commit"
          git push